<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEALON Arts Fest · Pento Edition</title>
<meta name="description" content="ZEALON Arts Fest – Pento Edition. Results and team points of Yaseen Islamia English Medium School, Maidan, Gagrian.">
<meta name="theme-color" content="#23266a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Roboto+Condensed:wght@400;500;700&family=Roboto+Slab:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23266a;--navy2:#2e3192;--gold:#d8b46a;--ink:#1b1d3a;--mute:#6b6f8e;--line:#e7e6f0;--bg:#f5f4fa;--card:#fff;
  --red:#d93b3b;--yellow:#f2b134;--blue:#1170aa;--green:#1d9b3d;
  --AURA:#f2761d;--PRISM:#0b9e8e;--NOVA:#5b3df5;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3,.fd{font-family:Fredoka,Poppins,system-ui,sans-serif;letter-spacing:.2px}
h2{font-size:22px;margin:0 0 12px}
h3{font-size:17px;margin:0 0 8px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:radial-gradient(120% 140% at 0% 0%,#3b3fa8 0%,var(--navy) 55%,#1a1c52 100%);color:#fff;position:relative;overflow:hidden}
header.top:before,header.top:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.22}
header.top:before{width:220px;height:220px;background:var(--yellow);right:-60px;top:-90px}
header.top:after{width:160px;height:160px;background:var(--red);left:-50px;bottom:-80px}
.brand{display:flex;align-items:center;gap:12px;padding:14px 0 10px;position:relative;z-index:1}
.brand .sl{width:46px;height:auto;flex:none}
.brand .t{flex:1;min-width:0}
.brand .t b{display:block;font-family:Fredoka,sans-serif;font-size:19px;line-height:1.15;letter-spacing:.5px}
.brand .t span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .zl{width:54px;height:54px;border-radius:14px;background:#fff;padding:3px;flex:none;object-fit:contain}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;position:relative;z-index:1;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:600;font-size:14px;color:#fff;border:1px solid rgba(255,255,255,.14)}
nav.tabs a.on{background:#fff;color:var(--navy)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
.live i{width:8px;height:8px;border-radius:50%;background:#9aa3b2;display:inline-block}
.live.ok i{background:#3bd16f;box-shadow:0 0 0 3px rgba(59,209,111,.25)}
.live.err i{background:#ff6b6b}

main{padding:18px 0 40px}
section.view{display:none}
section.view.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(20,20,60,.05),0 6px 20px rgba(20,20,60,.05);border:1px solid var(--line)}
.grid{display:grid;gap:14px}
.mt{margin-top:16px}.mt2{margin-top:26px}
.mu{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* hero */
.hero{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.hero img{width:120px;height:120px;border-radius:22px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.hero h1{font-size:30px;margin:0;line-height:1.05}
.hero h1 .z{background:linear-gradient(90deg,var(--red),var(--yellow) 30%,var(--blue) 60%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag span{font-family:Fredoka,sans-serif;font-weight:600;font-size:13px;padding:3px 10px;border-radius:999px;color:#fff}
.edition{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);background:#efeefb;padding:3px 10px;border-radius:6px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}
.cd div{background:var(--navy);color:#fff;border-radius:12px;padding:8px 2px}
.cd b{display:block;font-family:Fredoka,sans-serif;font-size:24px;line-height:1}
.cd small{font-size:11px;opacity:.8}

/* standings */
.stand{display:grid;gap:10px}
.team{display:grid;grid-template-columns:34px 58px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:#faf9ff;border:1px solid var(--line);position:relative;overflow:hidden}
.team .rk{font-family:Fredoka,sans-serif;font-size:24px;font-weight:700;color:var(--mute);text-align:center}
.team.first{background:linear-gradient(135deg,#fff8e6,#fff);border-color:#f0d9a0}
.team.first .rk{color:#c8961e}
.team img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.team .nm{font-family:Fredoka,sans-serif;font-size:20px;font-weight:700}
.bar{height:8px;border-radius:9px;background:#ecebf5;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.team .pt{font-family:Fredoka,sans-serif;font-size:30px;font-weight:700;text-align:right;line-height:1}
.team .pt small{display:block;font-family:Poppins,sans-serif;font-size:11px;font-weight:500;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:Fredoka,sans-serif;font-size:26px;color:var(--navy)}
.stat span{font-size:12px;color:var(--mute)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px}

/* result card */
.res{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.res .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.res .no{font-family:Fredoka,sans-serif;font-weight:700;font-size:13px;background:var(--navy);color:#fff;border-radius:9px;padding:5px 8px;flex:none;text-align:center;line-height:1.05}
.res .no small{display:block;font-size:9px;font-weight:500;opacity:.8;letter-spacing:.8px}
.res .ev{flex:1;min-width:0}
.res .ev b{display:block;font-family:Fredoka,sans-serif;font-size:18px;line-height:1.15}
.catb{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff;margin-top:3px}
.stg{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#efeefb;color:var(--navy);margin-top:3px}
.wn{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:9px 14px}
.wn+.wn{border-top:1px dashed var(--line)}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:700;font-size:13px;color:#fff}
.m1{background:linear-gradient(135deg,#f7d774,#c8961e)}
.m2{background:linear-gradient(135deg,#e3e6ec,#9097a6)}
.m3{background:linear-gradient(135deg,#f0b48a,#b06a3b)}
.wn .who b{display:block;font-weight:600;line-height:1.2}
.wn .who span{font-size:12px;color:var(--mute)}
.tm{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;font-family:Fredoka,sans-serif;letter-spacing:.4px}
.tm img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.ptb{font-family:Fredoka,sans-serif;font-weight:700;font-size:13px;padding:3px 8px;border-radius:8px;background:#f1f0fa;color:var(--navy);margin-left:6px}
details.res summary::-webkit-details-marker{display:none}
details.res[open] summary{background:#faf9ff}
.res .ft{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fbfbfe}

.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.lt{background:#efeefb;color:var(--navy)}
.btn.gd{background:var(--gold);color:#1b1d3a}
.btn.rd{background:#fde8e8;color:#b42318}
.btn.gr{background:#25d366;color:#fff}
.btn:disabled{opacity:.5}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.scroll{overflow-x:auto}
.empty{padding:24px;text-align:center;color:var(--mute)}
.pend{display:flex;flex-wrap:wrap;gap:6px}
.pend span{font-size:12px;background:#fff;border:1px dashed #cfcde0;border-radius:8px;padding:4px 8px;color:var(--mute)}

/* stars */
.star{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.star:last-child{border-bottom:0}
.star .rk{font-family:Fredoka,sans-serif;font-weight:700;color:var(--mute);text-align:center}
.star.s1 .rk{color:#c8961e;font-size:20px}

/* forms */
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],input[type=url],input[type=password],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid #d9d8e6;border-radius:11px;background:#fff;font-size:15px}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrow{display:grid;grid-template-columns:62px 78px 1fr 92px 58px 30px;gap:6px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line)}
.wrow label{margin-top:0}
.wrow input,.wrow select{padding:9px 7px;font-size:14px}
.x{border:0;background:#fde8e8;color:#b42318;border-radius:9px;height:38px;cursor:pointer;font-weight:700}
.note{background:#fff7e0;border:1px solid #f2dc9b;color:#6b5310;border-radius:12px;padding:10px 12px;font-size:13px}
.note.ok{background:#e9f8ef;border-color:#b6e5c8;color:#14532d}
.note.err{background:#fde8e8;border-color:#f5c2c2;color:#8a1c1c}
.alist .it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alist .it:last-child{border-bottom:0}
.alist .it .sp{min-width:0}
.alist .it b{font-weight:600}

/* modal */
.modal{position:fixed;inset:0;background:rgba(14,15,40,.6);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet .mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet .mh h3{flex:1;margin:0}
.close{border:0;background:#f1f0fa;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.pimg{width:100%;height:auto;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;transition:transform .25s,opacity .25s;max-width:90vw;opacity:0;visibility:hidden}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}

footer{background:var(--navy);color:#fff;padding:22px 0 30px;font-size:13px}
footer .row{gap:14px}
footer img{width:40px}
footer a{color:#fff;opacity:.6;font-size:12px}

@media(min-width:760px){
  .two{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:150px 1fr}
  .hero img{width:150px;height:150px}
  .hero h1{font-size:40px}
  .brand .t b{font-size:22px}
}
@media(max-width:520px){
  .wrow{grid-template-columns:1fr 1fr 40px}
  .wrow .wn2{grid-column:1 / -1}
}
</style>
</head>

<script>
(function(){
"use strict";
/* ---------- config (the database address is saved into the website file) ---------- */
var CONFIG = /*CONFIG*/{"db":"https://zealon-912b0-default-rtdb.asia-southeast1.firebasedatabase.app","room":"zealon-2026"}/*/CONFIG*/;

var PAGE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
var SEED = JSON.parse(document.getElementById("seed").textContent);
var LOGO = JSON.parse(document.getElementById("logos").textContent);

var TEAMS = [
  {id:"NOVA",  color:"#5b3df5", grad:"linear-gradient(135deg,#4f46e5,#c026d3)"},
  {id:"PRISM", color:"#0b9e8e", grad:"linear-gradient(135deg,#14b8a6,#2563eb)"},
  {id:"AURA",  color:"#f2761d", grad:"linear-gradient(135deg,#ff9a1f,#e5287a)"}
];
var CATS = [
  {id:"planet",  name:"Planet",          cls:"Class 6 – 8",       color:"#1170aa"},
  {id:"rainbow", name:"Rainbow",         cls:"Class 3 – 5",       color:"#d93b3b"},
  {id:"blooms",  name:"Blooms",          cls:"Class 1 – 2",       color:"#e0457b"},
  {id:"buds",    name:"Buds",            cls:"Nursery – UKG",     color:"#1d9b3d"},
  {id:"general", name:"General",         cls:"Group items · all classes", color:"#8b4fd8"}
];
var RULES = {planet:"On-stage: one programme per student (group items not counted).", rainbow:"On-stage: one programme per student (group items not counted).", blooms:"On-stage: minimum 1, maximum 2 programmes per student.", buds:"On-stage: minimum 1, maximum 2 programmes per student."};
var PLACE = {1:"1st",2:"2nd",3:"3rd"};
var TM = {}; TEAMS.forEach(function(t){TM[t.id]=t});
var CT = {}; CATS.forEach(function(c){CT[c.id]=c});

/* ---------- small helpers ---------- */
function $(s,el){return (el||document).querySelector(s)}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){n=String(n);while(n.length<3)n="0"+n;return n}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2600)}
function vals(o){return o?Object.keys(o).map(function(k){return o[k]}):[]}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function guessTeam(ch){var d=String(ch||"").charAt(0);return d==="1"?"AURA":d==="2"?"PRISM":d==="3"?"NOVA":""}
function teamLogo(id){return LOGO[id]||""}

/* ---------- data ---------- */
var S = normalise(clone(SEED));
var conn = {db:(ls("zl-db")||CONFIG.db||"").replace(/\/+$/,""), room:ls("zl-room")||CONFIG.room||"zealon-2026", key:ls("zl-key")||""};
var remote = { state:"off", empty:false, last:0 };
var cached = ls("zl-cache-"+conn.room);
if(conn.db && cached){ try{ var cj=JSON.parse(cached); if(cj && Object.keys(cj.results||{}).length) S = normalise(cj); }catch(e){} }
if(!conn.db){ var loc = ls("zl-local"); if(loc){ try{ S = normalise(JSON.parse(loc)); }catch(e){} } }

function normalise(d){
  d = d||{};
  d.settings = d.settings||{}; d.settings.pts = d.settings.pts||{"1":10,"2":7,"3":4};
  if(!d.settings.onStage) d.settings.onStage = "2026-11-21";
  d.students = d.students||{}; d.results = d.results||{}; d.events = d.events||{}; d.entries = d.entries||{};
  Object.keys(d.entries).forEach(function(k){ var e=d.entries[k]||{}; e.list = Array.isArray(e.list)? e.list.filter(Boolean) : vals(e.list); d.entries[k]=e; });
  vals(d.results).forEach(function(r){ r.winners = (r.winners||[]).filter(Boolean); });
  /* older copies kept Buds and Blooms together as "Buds: …" / "Blooms: …" */
  Object.keys(d.events).forEach(function(k){
    var e=d.events[k], m=/^(Buds|Blooms): (.*)$/.exec(e.name||"");
    if(!m || e.cat!=="buds") return;
    var cat=m[1].toLowerCase(), nid=cat+"-"+slug(m[2]);
    d.events[nid]=Object.assign({},e,{id:nid,cat:cat,name:m[2]}); if(nid!==k) delete d.events[k];
    if(d.entries[k] && nid!==k){ d.entries[nid]=d.entries[k]; delete d.entries[k]; }
  });
  vals(d.students).forEach(function(st){ if(st.sec==="Blooms") st.cat="blooms"; });
  return d;
}
function results(){ return vals(S.results).sort(function(a,b){return (b.no||0)-(a.no||0)}); }
function totals(cat){
  var t={}; TEAMS.forEach(function(x){t[x.id]=0});
  vals(S.results).forEach(function(r){ if(cat && r.cat!==cat) return; r.winners.forEach(function(w){ if(t[w.team]!=null) t[w.team]+= +w.pts||0; }); });
  return t;
}
function ranked(t){ return TEAMS.map(function(x){return {id:x.id,pts:t[x.id]||0}}).sort(function(a,b){return b.pts-a.pts}); }
function maxNo(){ return vals(S.results).reduce(function(m,r){return Math.max(m,r.no||0)},0); }
function eventsOf(cat){ return vals(S.events).filter(function(e){return e.cat===cat}).sort(function(a,b){return a.name.localeCompare(b.name)}); }
function declared(cat,name){ return vals(S.results).some(function(r){return r.cat===cat && r.event===name}); }

/* ---------- live database (Firebase Realtime Database REST) ---------- */
function url(path, write){
  var u = conn.db + "/" + encodeURIComponent(conn.room) + (path?"/"+path:"") + ".json";
  if(write && conn.key) u += "?auth=" + encodeURIComponent(conn.key);
  return u;
}
function checkUrl(){ return conn.db + "/_admin_check.json?auth=" + encodeURIComponent(conn.key); }
function hasData(d){ return d && (d.results || d.events || d.students || d.entries); }
function setLive(st, txt){
  remote.state = st;
  var l = $("#live"); l.className = "live " + (st==="ok"?"ok":st==="err"?"err":"");
  $("span",l).textContent = txt;
}
function pull(){
  if(!conn.db){ setLive("off","Results"); return Promise.resolve(); }
  return fetch(url(""), {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    remote.last = Date.now();
    if(!hasData(d)){ if(!remote.empty){ S = normalise(clone(SEED)); render(true); } remote.empty = true; setLive("ok","Live"); return; }
    remote.empty = false;
    var before = JSON.stringify(S);
    S = normalise(d);
    ls("zl-cache-"+conn.room, JSON.stringify(S));
    setLive("ok","Live · updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
    if(JSON.stringify(S)!==before) render(true);
  }).catch(function(e){ setLive("err","Offline – showing saved results"); });
}
function save(path, value){
  /* path like "results/r001"; value null = delete */
  var parts = path.split("/"), o = S;
  for(var i=0;i<parts.length-1;i++){ o[parts[i]] = o[parts[i]]||{}; o = o[parts[i]]; }
  if(value===null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = value;
  if(!conn.db){ ls("zl-local", JSON.stringify(S)); return Promise.resolve(true); }
  ls("zl-cache-"+conn.room, JSON.stringify(S));
  return fetch(url(path,true), {method: value===null?"DELETE":"PUT", body: value===null?undefined:JSON.stringify(value)})
    .then(function(r){ if(!r.ok) throw new Error(r.status===401||r.status===403?"The admin key is wrong or missing.":"Could not save (HTTP "+r.status+")."); return true; })
    .catch(function(e){ toast(e.message||"Could not save. Check the internet."); pull(); return false; });
}
function uploadAll(){
  return fetch(url("",true), {method:"PUT", body: JSON.stringify(S)}).then(function(r){
    if(!r.ok) throw new Error(r.status===401||r.status===403?"The admin key is wrong or missing.":"HTTP "+r.status);
    remote.empty=false; return true;
  });
}

/* ---------- routing ---------- */
var view = "home";
function route(){
  var h = (location.hash||"#home").slice(1);
  if(h==="onstage") h="programmes";
  if(["home","results","points","programmes","stars","admin"].indexOf(h)<0) h="home";
  view = h; closeModal();
  $$(".view").forEach(function(s){s.classList.toggle("on", s.id==="v-"+h)});
  $$("#tabs a").forEach(function(a){a.classList.toggle("on", a.getAttribute("data-v")===h)});
  $("#tabAdmin").style.display = (h==="admin"||conn.key)?"":"none";
  render();
  window.scrollTo(0,0);
}
function render(soft){
  if(view==="home") renderHome();
  else if(view==="results") renderResults(soft);
  else if(view==="points") renderPoints();
  else if(view==="stars") renderStars();
  else if(view==="programmes") renderOnstage(soft);
  else if(view==="admin" && !soft) renderAdmin();
  else if(view==="admin" && soft) renderAdminLists();
}

/* ---------- shared bits ---------- */
function teamTag(id){
  var t = TM[id]||{color:"#888"};
  return '<span class="tm" style="color:'+t.color+'">'+(teamLogo(id)?'<img src="'+teamLogo(id)+'" alt="">':'')+esc(id||"–")+'</span>';
}
function catBadge(c){ var x=CT[c]||{name:c,color:"#666"}; return '<span class="catb" style="background:'+x.color+'">'+esc(x.name)+'</span>'; }
function resultCard(r, admin){
  var w = r.winners.slice().sort(function(a,b){return a.place-b.place});
  var h = '<div class="res"><div class="hd"><div class="no"><small>RESULT</small>'+pad(r.no)+'</div><div class="ev"><b>'+esc(r.event)+'</b>'+catBadge(r.cat)+' <span class="stg">'+(r.stage==="on"?"On-stage":"Off-stage")+'</span></div></div>';
  w.forEach(function(x){
    h += '<div class="wn"><div class="medal m'+x.place+'">'+PLACE[x.place]+'</div><div class="who"><b>'+esc(x.name||"—")+'</b><span>'+(x.ch?"Chest No. "+esc(x.ch):"")+'</span></div><div>'+teamTag(x.team)+'<span class="ptb">+'+(+x.pts||0)+'</span></div></div>';
  });
  h += '<div class="ft"><button class="btn sm" data-poster="'+esc(r.id)+'">Poster</button><button class="btn sm lt" data-text="'+esc(r.id)+'">Copy as text</button>';
  if(admin) h += '<span class="sp"></span><button class="btn sm lt" data-edit="'+esc(r.id)+'">Edit</button><button class="btn sm rd" data-del="'+esc(r.id)+'">Delete</button>';
  return h + '</div></div>';
}
function standingsHTML(t){
  var r = ranked(t), max = Math.max(1, r[0].pts);
  return '<div class="stand">'+r.map(function(x,i){
    var tm = TM[x.id];
    return '<div class="team'+(i===0&&x.pts>0?" first":"")+'"><div class="rk">'+(i+1)+'</div><img src="'+teamLogo(x.id)+'" alt="Team '+x.id+'"><div><div class="nm" style="color:'+tm.color+'">'+x.id+'</div><div class="bar"><i style="width:'+(x.pts/max*100).toFixed(1)+'%;background:'+tm.grad+'"></i></div></div><div class="pt">'+x.pts+'<small>points</small></div></div>';
  }).join("")+'</div>';
}

    '<div class="mu mt">Off-stage competitions are going on now. On-stage day: <b style="color:var(--ink)">'+fmtDate(S.settings.onStage)+'</b>'+(S.settings.venue?' · '+esc(S.settings.venue):'')+'</div>'+

  h += '<div class="card mt"><div class="row" style="margin-bottom:10px"><h2 style="margin:0" class="sp">Team Standings</h2><button class="btn sm lt" id="ptPoster">Points poster</button></div>'+standingsHTML(t)+

  var nOn = vals(S.events).filter(function(e){return e.stage==="on"}).length;
  if(nOn) h += '<a class="card mt" href="#programmes" style="display:flex;gap:12px;align-items:center;text-decoration:none;background:linear-gradient(135deg,#fff8e6,#fff)"><div class="fd" style="font-size:30px">🎤</div><div class="sp"><b class="fd" style="font-size:18px">Programmes & participants</b><div class="mu">'+nOn+' on-stage programmes on '+fmtDate(S.settings.onStage)+', plus off-stage. Find your name and see your programmes.</div></div><b style="font-size:20px">→</b></a>';
  h += '<div class="row mt2"><h2 class="sp" style="margin:0">Latest Results</h2><a class="btn sm lt" href="#results">All results →</a></div><div class="grid mt">';
  h += all.length? all.slice(0,4).map(function(r){return resultCard(r)}).join("") : '<div class="card empty">No results yet.</div>';
  h += '</div>';
  $("#v-home").innerHTML = h;
  $("#ptPoster").onclick = function(){ openPointsPoster(); };

function fmtDate(d){ if(!d) return "–"; var x=new Date(d+"T00:00:00"); return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); }
function countdownHTML(){ return '<div class="cd" id="cd"></div>'; }
function tickCountdown(){
  var el = $("#cd"); if(!el) return;
  var target = new Date((S.settings.onStage||"2026-11-21")+"T09:00:00"), ms = target - new Date();
  if(isNaN(ms)||ms<=0){ el.style.display="none"; return; }
  var d=Math.floor(ms/864e5), hh=Math.floor(ms%864e5/36e5), mm=Math.floor(ms%36e5/6e4), ss=Math.floor(ms%6e4/1e3);
  el.innerHTML = [[d,"days"],[hh,"hours"],[mm,"mins"],[ss,"secs"]].map(function(x){return '<div><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'}).join("");
}
setInterval(function(){ if(view==="home") tickCountdown(); }, 1000);

/* ---------- RESULTS ---------- */
var RF = {cat:"", stage:"", q:""};
function renderResults(soft){
  var el = $("#v-results");
  if(!soft || !$("#rq")){
    el.innerHTML = '<h2>Results</h2><div class="chips" id="rcat"></div><div class="chips mt" id="rstg" style="margin-top:8px"></div>'+
      '<input class="search mt" id="rq" type="search" placeholder="Search event, name or chest number" value="'+esc(RF.q)+'">'+
      '<div class="grid mt" id="rlist"></div><div id="rpend"></div>';
    $("#rq").oninput = function(){ RF.q = this.value; listResults(); };
  }
  $("#rcat").innerHTML = [["","All"]].concat(CATS.map(function(c){return [c.id,c.name]})).map(function(c){return '<button class="chip'+(RF.cat===c[0]?" on":"")+'" data-c="'+c[0]+'">'+esc(c[1])+'</button>'}).join("");
  $("#rstg").innerHTML = [["","All stages"],["off","Off-stage"],["on","On-stage"]].map(function(c){return '<button class="chip'+(RF.stage===c[0]?" on":"")+'" data-s="'+c[0]+'">'+c[1]+'</button>'}).join("");
  $$("#rcat .chip").forEach(function(b){ b.onclick=function(){RF.cat=b.getAttribute("data-c"); renderResults(true);} });
  $$("#rstg .chip").forEach(function(b){ b.onclick=function(){RF.stage=b.getAttribute("data-s"); renderResults(true);} });
  listResults();
}
function listResults(){
  var q = RF.q.trim().toLowerCase();
  var l = results().filter(function(r){
    if(RF.cat && r.cat!==RF.cat) return false;
    if(RF.stage && (r.stage||"off")!==RF.stage) return false;
    if(!q) return true;
    var hay = (r.event+" "+pad(r.no)+" "+(CT[r.cat]||{}).name+" "+r.winners.map(function(w){return w.name+" "+w.ch+" "+w.team}).join(" ")).toLowerCase();
    return hay.indexOf(q)>=0;
  });
  $("#rlist").innerHTML = l.length? l.map(function(r){return resultCard(r)}).join("") : '<div class="card empty">No results match.</div>';
  var cats = RF.cat? [CT[RF.cat]] : CATS, p = "";
  cats.forEach(function(c){
    var pe = eventsOf(c.id).filter(function(e){ return !declared(c.id,e.name) && (!RF.stage || e.stage===RF.stage); });
    if(pe.length) p += '<div class="mt"><div class="mu" style="margin-bottom:6px"><b>'+esc(c.name)+'</b> – results not declared yet</div><div class="pend">'+pe.map(function(e){return '<span>'+esc(e.name)+'</span>'}).join("")+'</div></div>';
  });
  $("#rpend").innerHTML = (!q && p) ? '<div class="mt2">'+p+'</div>' : "";
}

/* ---------- POINTS ---------- */
function renderPoints(){
  var t = totals(), h = '<h2>Points Table</h2><div class="card">'+standingsHTML(t)+'<div class="row mt"><button class="btn sm lt" id="ptPoster2">Points poster</button></div></div>';
  h += '<div class="card mt"><h3>Category-wise points</h3><div class="scroll"><table class="tbl"><thead><tr><th>Category</th>'+TEAMS.map(function(x){return '<th class="n" style="color:'+x.color+'">'+x.id+'</th>'}).join("")+'</tr></thead><tbody>';
  CATS.forEach(function(c){ var ct=totals(c.id); h += '<tr><td><b>'+esc(c.name)+'</b><div class="mu">'+esc(c.cls)+'</div></td>'+TEAMS.map(function(x){return '<td class="n">'+ct[x.id]+'</td>'}).join("")+'</tr>'; });
  h += '<tr class="tot"><td>Total</td>'+TEAMS.map(function(x){return '<td class="n">'+t[x.id]+'</td>'}).join("")+'</tr></tbody></table></div></div>';
  CATS.forEach(function(c){
    var rs = results().filter(function(r){return r.cat===c.id}).sort(function(a,b){return a.no-b.no});
    if(!rs.length) return;
    h += '<div class="card mt"><h3>'+esc(c.name)+' <span class="mu" style="font-weight:400">· event-wise</span></h3><div class="scroll"><table class="tbl"><thead><tr><th>No.</th><th>Event</th>'+TEAMS.map(function(x){return '<th class="n" style="color:'+x.color+'">'+x.id+'</th>'}).join("")+'</tr></thead><tbody>';
    var sum={}; TEAMS.forEach(function(x){sum[x.id]=0});
    rs.forEach(function(r){
      var p={}; TEAMS.forEach(function(x){p[x.id]=0});
      r.winners.forEach(function(w){ if(p[w.team]!=null) p[w.team]+= +w.pts||0; });
      TEAMS.forEach(function(x){sum[x.id]+=p[x.id]});
      h += '<tr><td>'+pad(r.no)+'</td><td>'+esc(r.event)+'</td>'+TEAMS.map(function(x){return '<td class="n">'+(p[x.id]||'<span class="mu">0</span>')+'</td>'}).join("")+'</tr>';
    });
    h += '<tr class="tot"><td></td><td>Total</td>'+TEAMS.map(function(x){return '<td class="n">'+sum[x.id]+'</td>'}).join("")+'</tr></tbody></table></div></div>';
  });
  $("#v-points").innerHTML = h;
  $("#ptPoster2").onclick = function(){ openPointsPoster(); };
}

/* ---------- STARS ---------- */
function individuals(cat){
  var m = {};
  vals(S.results).forEach(function(r){
    if(r.cat!==cat || r.group) return;
    r.winners.forEach(function(w){
      var k = w.ch ? "c"+w.ch : "n"+w.name+"|"+w.team;
      if(!m[k]) m[k] = {name:w.name, ch:w.ch, team:w.team, pts:0, first:0, events:[]};
      m[k].pts += +w.pts||0; if(w.place===1) m[k].first++;
      m[k].events.push(r.event+" ("+PLACE[w.place]+")");
    });
  });
  return vals(m).sort(function(a,b){return b.pts-a.pts || b.first-a.first || a.name.localeCompare(b.name)});
}
function renderStars(){
  var h = '<h2>Star Performers</h2><div class="mu" style="margin-top:-6px;margin-bottom:12px">Top individual scorers in each category, from all results declared so far. Group items are not counted here.</div><div class="grid two">';
  CATS.filter(function(c){return c.id!=="general"}).forEach(function(c){
    var l = individuals(c.id).slice(0,8);
    h += '<div class="card"><div class="row" style="margin-bottom:4px"><h3 class="sp" style="margin:0">'+esc(c.name)+'</h3><span class="mu">'+esc(c.cls)+'</span></div>';
    if(!l.length){ h += '<div class="empty">No results yet.</div></div>'; return; }
    var rank=0, prev=null;
    l.forEach(function(x,i){
      if(x.pts!==prev){ rank=i+1; prev=x.pts; }
      h += '<div class="star'+(rank===1?" s1":"")+'"><div class="rk">'+rank+'</div><div><b>'+esc(x.name)+'</b><div class="mu">'+(x.ch?"Chest "+esc(x.ch)+" · ":"")+esc(x.events.join(", "))+'</div></div><div style="text-align:right">'+teamTag(x.team)+'<div class="fd" style="font-size:20px;font-weight:700;margin-top:2px">'+x.pts+'</div></div></div>';
    });
    h += '</div>';
  });
  $("#v-stars").innerHTML = h + '</div>';
}

/* ---------- ON-STAGE participants ---------- */
function eventByName(cat,name){ return vals(S.events).find(function(e){return e.cat===cat && e.name===name}); }
function entriesOf(cat,name){ var e=eventByName(cat,name); return e && S.entries[e.id] ? S.entries[e.id].list : []; }
function onEvents(cat, stage){ return vals(S.events).filter(function(e){return (!stage || (e.stage||"off")===stage) && (!cat || e.cat===cat)}).sort(function(a,b){ return CATS.findIndex(function(c){return c.id===a.cat}) - CATS.findIndex(function(c){return c.id===b.cat}) || a.name.localeCompare(b.name); }); }
var OF = {stage:"on", cat:"planet", q:""};
function renderOnstage(soft){
  var el = $("#v-programmes");
  if(!soft || !$("#oq")){
    el.innerHTML = '<h2>Programmes</h2><div class="mu" style="margin-top:-6px">Who takes part in each programme, team by team. Search a name to see all of a student’s programmes.</div>'+
      '<input class="search mt" id="oq" type="search" placeholder="Find a student: name or chest number" value="'+esc(OF.q)+'"><div class="chips mt" id="ostg"></div><div class="chips" id="ocat" style="margin-top:8px"></div><div id="obody" class="mt"></div>';
    $("#oq").oninput = function(){ OF.q=this.value; drawOn(); };
  }
  $("#ostg").innerHTML = [["on","On-stage · "+fmtDate(S.settings.onStage).replace(/ \d{4}$/,"")],["off","Off-stage"]].map(function(x){return '<button class="chip'+(OF.stage===x[0]?" on":"")+'" data-s="'+x[0]+'">'+esc(x[1])+'</button>'}).join("");
  $$("#ostg .chip").forEach(function(b){ b.onclick=function(){ OF.stage=b.getAttribute("data-s"); if(!onEvents(OF.cat,OF.stage).length){ var c=CATS.find(function(c){return onEvents(c.id,OF.stage).length}); if(c) OF.cat=c.id; } renderOnstage(true); }; });
  $("#ocat").innerHTML = CATS.map(function(c){ var n=onEvents(c.id,OF.stage).length; return n?'<button class="chip'+(OF.cat===c.id?" on":"")+'" data-c="'+c.id+'">'+esc(c.name)+' <span style="opacity:.6">'+n+'</span></button>':''; }).join("");
  $$("#ocat .chip").forEach(function(b){ b.onclick=function(){ OF.cat=b.getAttribute("data-c"); OF.q=""; $("#oq").value=""; renderOnstage(true); }; });
  drawOn();
}
function drawOn(){
  var q = OF.q.trim().toLowerCase(), b = $("#obody");
  $("#ocat").style.display = $("#ostg").style.display = q ? "none" : "";
  if(q){
    var who = {};
    onEvents().forEach(function(e){ (S.entries[e.id]||{list:[]}).list.forEach(function(p){
      if((p.name+" "+p.ch).toLowerCase().indexOf(q)<0) return;
      var k = p.ch? "c"+p.ch : "n"+p.name+p.team;
      if(!who[k]) who[k] = {p:p, ev:[]};
      who[k].ev.push(e);
    }); });
    var l = vals(who).sort(function(a,b){return a.p.name.localeCompare(b.p.name)});
    b.innerHTML = l.length ? '<div class="grid">'+l.slice(0,60).map(function(x){
      return '<div class="card"><div class="row"><div class="sp"><b class="fd" style="font-size:18px">'+esc(x.p.name)+'</b><div class="mu">'+(x.p.ch?"Chest No. "+esc(x.p.ch):"")+'</div></div>'+teamTag(x.p.team)+'</div><div class="alist mt">'+
        x.ev.sort(function(a,b){return (a.stage==="on")-(b.stage==="on")}).map(function(e){ return '<div class="it"><div class="sp"><b>'+esc(e.name)+'</b><div class="mu">'+(e.stage==="on"?"On-stage":"Off-stage")+(declared(e.cat,e.name)?" · result out":"")+'</div></div>'+catBadge(e.cat)+'</div>'; }).join("")+'</div></div>';
    }).join("")+'</div>' : '<div class="card empty">No programme found for “'+esc(OF.q)+'”.</div>';
    return;
  }
  var evs = onEvents(OF.cat, OF.stage);
  var h = OF.stage==="on" && RULES[OF.cat] ? '<div class="note" style="margin-bottom:12px">'+esc(RULES[OF.cat])+'</div>' : '';
  h += evs.length ? '<div class="grid">'+evs.map(function(e){
    var list = (S.entries[e.id]||{list:[]}).list, done = declared(e.cat,e.name);
    var cnt = TEAMS.map(function(t){ return list.filter(function(p){return p.team===t.id}).length; });
    return '<details class="res"><summary class="hd" style="cursor:pointer;list-style:none"><div class="ev"><b>'+esc(e.name)+'</b>'+
      (e.group?'<span class="stg">Group</span> ':'')+(done?'<span class="catb" style="background:#1d9b3d">Result out</span>':'')+
      '</div><div class="mu" style="text-align:right;white-space:nowrap">'+list.length+' <span style="font-size:11px">entries</span> ▾</div></summary>'+
      TEAMS.map(function(t,i){
        var tl = list.filter(function(p){return p.team===t.id});
        return '<div style="padding:10px 14px;border-top:1px solid var(--line)"><div class="row" style="margin-bottom:4px">'+teamTag(t.id)+'<span class="mu">'+cnt[i]+'</span></div>'+
          (tl.length? tl.map(function(p){return '<div style="display:flex;gap:10px;padding:3px 0"><span class="mu" style="width:36px;font-variant-numeric:tabular-nums">'+esc(p.ch||"–")+'</span><span>'+esc(p.name)+'</span></div>'}).join("") : '<div class="mu">No entry yet</div>')+'</div>';
      }).join("")+'</details>';
  }).join("")+'</div>' : '<div class="card empty">No programmes in this category.</div>';
  b.innerHTML = h;
}

/* ----- admin: participants ----- */
var AP = {stage:"on", cat:"planet", ev:""};
function adminParts(b){
  var evs = onEvents(AP.cat, AP.stage);
  if(!evs.some(function(e){return e.id===AP.ev})) AP.ev = evs.length? evs[0].id : "";
  var e = S.events[AP.ev], list = e && S.entries[e.id] ? S.entries[e.id].list.slice() : [];
  var h = '<div class="card"><label style="margin-top:0">Stage</label><div class="chips" id="pstg">'+[["on","On-stage"],["off","Off-stage"]].map(function(x){return '<button class="chip'+(AP.stage===x[0]?" on":"")+'" data-s="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div><label>Category</label><div class="chips" id="pcat">'+CATS.map(function(c){return '<button class="chip'+(AP.cat===c.id?" on":"")+'" data-c="'+c.id+'">'+esc(c.name)+'</button>'}).join("")+'</div>'+
    '<label>Event</label><select id="pev">'+evs.map(function(x){ var n=(S.entries[x.id]||{list:[]}).list.length; return '<option value="'+esc(x.id)+'"'+(x.id===AP.ev?" selected":"")+'>'+esc(x.name)+' ('+n+')</option>'; }).join("")+'</select>'+
    '<div class="mu" style="margin-top:6px">To add a new event, use the Events tab.</div></div>';
  if(e){
    TEAMS.forEach(function(t){
      var tl = list.filter(function(p){return p.team===t.id});
      var over = false;
      h += '<div class="card mt"><div class="row">'+teamTag(t.id)+'<span class="sp"></span><span class="mu"'+(over?' style="color:#b42318;font-weight:600"':'')+'>'+tl.length+(e.size?' / '+e.size:'')+(over?' – more than allowed':'')+'</span></div><div class="alist mt">'+
        (tl.map(function(p){ return '<div class="it"><b style="width:44px">'+esc(p.ch||"–")+'</b><div class="sp">'+esc(p.name)+'</div><button class="btn sm rd" data-prm="'+list.indexOf(p)+'">Remove</button></div>'; }).join("") || '<div class="mu">No entry yet</div>')+
        '</div><div class="row mt" style="flex-wrap:nowrap"><input type="number" inputmode="numeric" placeholder="Chest no." data-pch="'+t.id+'" style="width:110px"><input type="text" placeholder="Name" data-pnm="'+t.id+'"><button class="btn sm" data-padd="'+t.id+'">Add</button></div></div>';
    });
  }
  b.innerHTML = h;
  $$("#pstg .chip",b).forEach(function(x){ x.onclick=function(){ AP.stage=x.getAttribute("data-s"); AP.ev=""; adminParts(b); }; });
  $$("#pcat .chip",b).forEach(function(x){ x.onclick=function(){ AP.cat=x.getAttribute("data-c"); AP.ev=""; adminParts(b); }; });
  if($("#pev",b)) $("#pev",b).onchange = function(){ AP.ev=this.value; adminParts(b); };
  if(!e) return;
  function put(nl){ return save("entries/"+e.id, {list:nl}).then(function(ok){ if(ok){ toast("Saved"); adminParts(b); } }); }
  $$("[data-prm]",b).forEach(function(x){ x.onclick=function(){ var nl=list.slice(); nl.splice(+x.getAttribute("data-prm"),1); put(nl); }; });
  $$("[data-pch]",b).forEach(function(inp){ inp.oninput=function(){ var s=S.students[inp.value.trim()], nm=$('[data-pnm="'+inp.getAttribute("data-pch")+'"]',b); if(s){ nm.value=s.name; if(s.team!==inp.getAttribute("data-pch")) toast("Chest "+s.ch+" is in team "+s.team); } }; });
  $$("[data-padd]",b).forEach(function(x){ x.onclick=function(){
    var tm=x.getAttribute("data-padd"), ch=$('[data-pch="'+tm+'"]',b).value.trim(), nm=$('[data-pnm="'+tm+'"]',b).value.trim();
    if(!nm) return toast("Enter chest no. or name");
    if(ch && list.some(function(p){return String(p.ch)===ch})) return toast("Already in the list");
    var nl=list.slice(); nl.push({ch:ch?+ch:"", name:nm, team:tm});
    var jobs=[put(nl)];
    if(ch && !S.students[ch]) jobs.push(save("students/"+ch,{ch:+ch,name:nm,team:tm,cat:e.cat==="general"?"planet":e.cat}));
  }; });
}

/* ---------- result text (WhatsApp) ---------- */
function resultText(r){
  var c = CT[r.cat]||{name:r.cat};
  var t = "🎨 *ZEALON Arts Fest – Pento Edition*\n*Result No. "+pad(r.no)+"*\n"+c.name+" ("+(c.cls||"")+") · "+r.event+"\n\n";
  var em = {1:"🥇",2:"🥈",3:"🥉"};
  r.winners.slice().sort(function(a,b){return a.place-b.place}).forEach(function(w){ t += em[w.place]+" "+w.name+(w.ch?" ("+w.ch+")":"")+" – Team "+w.team+"\n"; });
  var rk = ranked(totals());
  t += "\n*Points:* "+rk.map(function(x){return x.id+" "+x.pts}).join(" | ")+"\n\nYaseen Islamia English Medium School, Maidan, Gagrian";
  return t;
}
function copyText(t){
  function fallback(){ openModal("Copy text", '<textarea id="cpt" style="min-height:240px;font-family:inherit">'+esc(t)+'</textarea><div class="mu mt">Select all and copy.</div>'); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){toast("Copied. Paste it in WhatsApp.")}, fallback);
  else fallback();
}

/* ---------- modal ---------- */
function openModal(title, html){
  $("#sheet").innerHTML = '<div class="mh"><h3>'+esc(title)+'</h3><button class="close" id="mclose" aria-label="Close">×</button></div>'+html;
  $("#modal").classList.add("on");

      '<div class="'+(inModal?"":"card")+'">'+
      '<div class="f2"><div><label>Result no.</label><input type="number" id="fno" value="'+esc(r.no)+'"></div><div><label>Stage</label><select id="fst"><option value="off"'+(r.stage!=="on"?" selected":"")+'>Off-stage</option><option value="on"'+(r.stage==="on"?" selected":"")+'>On-stage</option></select></div></div>'+
      '<label>Category</label><div class="chips" id="fcat">'+CATS.map(function(c){return '<button type="button" class="chip'+(r.cat===c.id?" on":"")+'" data-c="'+c.id+'">'+esc(c.name)+'</button>'}).join("")+'</div>'+
      '<label>Event</label><select id="fev">'+evOptions()+'</select><input type="text" id="fevn" placeholder="New event name" style="display:none;margin-top:6px">'+
      '<label style="margin-top:14px">Winners <span style="font-weight:400">– type the chest number, the name and team fill in by themselves</span></label><div id="fw"></div>'+
      '<div class="row mt"><button type="button" class="btn sm lt" id="fadd">+ Add another winner</button></div>'+
      '<div id="fmsg" class="mt"></div>'+
      '<div class="row mt"><button class="btn" id="fsave">'+(id?"Save changes":"Save result")+'</button>'+(id?'':'<button class="btn gd" id="fsavep">Save & make poster</button>')+'</div></div>';
    drawW();
    $$("#fcat .chip",box).forEach(function(b){ b.onclick=function(){ r.cat=b.getAttribute("data-c"); r.event=""; formInto.lastCat=r.cat; draw(); }; });
    $("#fev",box).onchange = function(){ if(this.value==="__new"){ $("#fevn",box).style.display=""; $("#fevn",box).focus(); r.event=""; } else { $("#fevn",box).style.display="none"; r.event=this.value; var e=vals(S.events).find(function(x){return x.cat===r.cat&&x.name===r.event}); if(e){ r.stage=e.stage||"off"; $("#fst",box).value=r.stage; } } drawW(); };
    $("#fevn",box).oninput = function(){ r.event=this.value.trim(); };
    $("#fno",box).oninput = function(){ r.no = parseInt(this.value,10)||""; };
    $("#fst",box).onchange = function(){ r.stage=this.value; };
    $("#fadd",box).onclick = function(){ var last=r.winners[r.winners.length-1]; var p=last?last.place:1; r.winners.push({place:p, pts:S.settings.pts[p]}); drawW(); };
    $("#fsave",box).onclick = function(){ submit(false); };
    if($("#fsavep",box)) $("#fsavep",box).onclick = function(){ submit(true); };
  }
  function drawW(){
    var fw = $("#fw",box);
    var ent = entriesOf(r.cat, r.event);
    var dl = '<datalist id="fdl">'+ent.filter(function(x){return x.ch}).map(function(x){return '<option value="'+esc(x.ch)+'" label="'+esc(x.name+" · "+x.team)+'"></option>'}).join("")+'</datalist>';
    var ev = eventByName(r.cat, r.event);
    var hint = ent.length ? '<div class="mu" style="margin:2px 0 4px">'+ent.length+' participants listed for this event – tap the chest no. box to pick.'+(ev&&ev.group?' Group item: you can leave chest no. empty and just choose the team.':'')+'</div>' : '';
    fw.innerHTML = dl + hint + r.winners.map(function(w,i){
      return '<div class="wrow" data-i="'+i+'">'+
        '<div><label>Place</label><select data-k="place">'+[1,2,3].map(function(p){return '<option value="'+p+'"'+(w.place==p?" selected":"")+'>'+PLACE[p]+'</option>'}).join("")+'</select></div>'+
        '<div><label>Chest no.</label><input type="number" inputmode="numeric" data-k="ch" list="fdl" value="'+esc(w.ch||"")+'"></div>'+
        '<div class="wn2"><label>Name</label><input type="text" data-k="name" value="'+esc(w.name||"")+'"></div>'+
        '<div class="wt"><label>Team</label><select data-k="team"><option value="">–</option>'+TEAMS.map(function(t){return '<option'+(w.team===t.id?" selected":"")+'>'+t.id+'</option>'}).join("")+'</select></div>'+
        '<div class="wp"><label>Points</label><input type="number" data-k="pts" value="'+esc(w.pts)+'"></div>'+
        '<button type="button" class="x" data-rm="'+i+'" aria-label="Remove">×</button></div>';
    }).join("");
    $$(".wrow",fw).forEach(function(row){
      var i = +row.getAttribute("data-i"), w = r.winners[i];
      $$("[data-k]",row).forEach(function(inp){
        var k = inp.getAttribute("data-k");
        inp.addEventListener(inp.tagName==="SELECT"?"change":"input", function(){
          if(k==="place"){ var old=w.place; w.place=+inp.value; if(+w.pts===+S.settings.pts[old]) { w.pts=S.settings.pts[w.place]; $('[data-k=pts]',row).value=w.pts; } }
          else if(k==="pts") w.pts = inp.value===""?"":+inp.value;
          else if(k==="ch"){
            w.ch = inp.value.trim(); var s = S.students[w.ch];
            if(s){ w.name=s.name; w.team=s.team; $('[data-k=name]',row).value=s.name; $('[data-k=team]',row).value=s.team; if(s.cat && s.cat!==r.cat) setMsg('Chest '+w.ch+' is listed in '+((CT[s.cat]||{}).name||s.cat)+'.', ""); else setMsg("",""); }
            else { var g=guessTeam(w.ch); if(g && w.ch.length>=3){ w.team=g; $('[data-k=team]',row).value=g; } }
          }
          else if(k==="team"){ w.team = inp.value; var ev=eventByName(r.cat,r.event); if(ev && ev.group && !w.ch && (!w.name || /^Team /.test(w.name))){ w.name = w.team?"Team "+w.team:""; $('[data-k=name]',row).value=w.name; } }
          else w[k] = inp.value;
        });
      });
    });
    $$("[data-rm]",fw).forEach(function(b){ b.onclick=function(){ r.winners.splice(+b.getAttribute("data-rm"),1); drawW(); }; });
  }
  function setMsg(t,cls){ var m=$("#fmsg",box); m.innerHTML = t?'<div class="note '+(cls||"")+'">'+t+'</div>':""; }
  function submit(poster){
    var ws = r.winners.filter(function(w){ return (w.name||"").trim(); }).map(function(w){ return {place:+w.place, ch:w.ch?(isNaN(+w.ch)?w.ch:+w.ch):"", name:w.name.trim(), team:w.team||"", pts:+w.pts||0}; });
    if(!r.event) return setMsg("Choose or type the event.","err");
    if(!r.no) return setMsg("Enter the result number.","err");
    if(!ws.length) return setMsg("Add at least one winner.","err");
    var noTeam = ws.filter(function(w){return !w.team});
    if(noTeam.length) return setMsg("Choose the team for "+esc(noTeam[0].name)+".","err");
    var dupNo = vals(S.results).find(function(x){return x.no==r.no && x.id!==r.id});
    if(dupNo) return setMsg("Result no. "+pad(r.no)+" is already used for "+esc(dupNo.event)+". Change the number.","err");
    var rid = r.id || ("r"+Date.now().toString(36));
    var evx = eventByName(r.cat, r.event);
    var rec = {id:rid, no:+r.no, cat:r.cat, event:r.event, stage:r.stage||"off", winners:ws, t:Date.now()};
    if(evx && evx.group) rec.group = true;
    $("#fsave",box).disabled = true;
    var jobs = [];
    var evExists = vals(S.events).some(function(e){return e.cat===r.cat && e.name===r.event});
    if(!evExists){ var eid=r.cat+"-"+slug(r.event); jobs.push(save("events/"+eid, {id:eid, cat:r.cat, name:r.event, stage:rec.stage})); }
    ws.forEach(function(w){ if(w.ch && !S.students[w.ch]) jobs.push(save("students/"+w.ch, {ch:w.ch, name:w.name, team:w.team, cat:r.cat})); });
    jobs.push(save("results/"+rid, rec));
    Promise.all(jobs).then(function(ok){
      if(ok.indexOf(false)>=0){ $("#fsave",box).disabled=false; return; }
      toast(id?"Result updated":"Result "+pad(rec.no)+" saved");
      if(inModal) closeModal();
      if(poster) openResultPoster(rid);
      if(!id){ r = {id:"", no:maxNo()+1, cat:r.cat, event:"", stage:"off", winners:[{place:1,pts:S.settings.pts[1]},{place:2,pts:S.settings.pts[2]},{place:3,pts:S.settings.pts[3]}]}; }
      if(view==="admin" && AT==="add" && !inModal) draw(); else render(true);
    });
  }
  draw();
}
function confirmDelete(id){
  var r = S.results[id]; if(!r) return;
  openModal("Delete result?", '<p>Delete <b>Result '+pad(r.no)+' – '+esc(r.event)+'</b> ('+esc((CT[r.cat]||{}).name||"")+')? The team points will go down.</p><div class="row"><button class="btn rd" id="dyes">Delete</button><button class="btn lt" id="dno">Cancel</button></div>');
  $("#dno").onclick = closeModal;
  $("#dyes").onclick = function(){ save("results/"+id, null).then(function(ok){ if(ok){ toast("Deleted"); closeModal(); render(true); } }); };
}

/* ----- admin: results list ----- */
var AQ = "";
function adminResults(b){
  b.innerHTML = '<input class="search" id="aq" type="search" placeholder="Search results" value="'+esc(AQ)+'"><div class="grid mt" id="alist"></div>';
  function draw(){
    var q = AQ.toLowerCase();
    var l = results().filter(function(r){ return !q || (r.event+" "+pad(r.no)+" "+r.winners.map(function(w){return w.name+" "+w.ch}).join(" ")).toLowerCase().indexOf(q)>=0; });
    $("#alist").innerHTML = l.length? l.map(function(r){return resultCard(r,true)}).join("") : '<div class="card empty">No results.</div>';
  }
  $("#aq").oninput = function(){ AQ=this.value; draw(); };
  draw();
}

/* ----- admin: students ----- */
var SQ = "";
function adminStudents(b){
  var n = Object.keys(S.students).length;
  b.innerHTML = '<div class="card"><h3>Add or update one student</h3><div class="f2"><div><label>Chest no.</label><input type="number" id="sch"></div><div><label>Team</label><select id="stm">'+TEAMS.map(function(t){return '<option>'+t.id+'</option>'}).join("")+'</select></div></div>'+
    '<label>Name</label><input type="text" id="snm"><label>Category</label><select id="sct">'+CATS.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select>'+
    '<div class="row mt"><button class="btn" id="ssv">Save student</button></div></div>'+
    '<div class="card mt"><h3>Add many students</h3><div class="mu">Paste rows from Excel: <b>Chest No, Name, Team, Category</b> (one student per line).</div><textarea id="sbulk" class="mt" placeholder="401, Ahmed Ali, AURA, Blooms"></textarea><div class="row mt"><button class="btn" id="sbk">Import rows</button></div></div>'+
    '<div class="card mt"><div class="row"><h3 class="sp" style="margin:0">All students ('+n+')</h3></div><input class="search mt" id="sq" type="search" placeholder="Search name or chest no." value="'+esc(SQ)+'"><div class="alist mt" id="slist"></div></div>';
  $("#sch").oninput = function(){ var s=S.students[this.value.trim()]; if(s){ $("#snm").value=s.name; $("#stm").value=s.team; $("#sct").value=s.cat||"planet"; } else { var g=guessTeam(this.value); if(g) $("#stm").value=g; } };
  $("#ssv").onclick = function(){
    var ch=$("#sch").value.trim(), nm=$("#snm").value.trim(); if(!ch||!nm) return toast("Enter chest number and name");
    save("students/"+ch, {ch:+ch, name:nm, team:$("#stm").value, cat:$("#sct").value}).then(function(ok){ if(ok){ toast("Saved "+nm); adminStudents(b);} });
  };
  $("#sbk").onclick = function(){
    var rows = $("#sbulk").value.split(/\n/).map(function(l){return l.split(/\t|,/).map(function(x){return x.trim()})}).filter(function(c){return c[0] && c[1] && /^\d+$/.test(c[0])});
    if(!rows.length) return toast("No rows found");
    var jobs = rows.map(function(c){
      var tm = (c[2]||"").toUpperCase(); if(!TM[tm]) tm = guessTeam(c[0])||"AURA";
      var ct = (c[3]||"").toLowerCase(); var cat = ct.indexOf("bloom")>=0?"blooms":ct.indexOf("bud")>=0?"buds":ct.indexOf("rain")>=0?"rainbow":ct.indexOf("plan")>=0?"planet":"buds";
      return save("students/"+c[0], {ch:+c[0], name:c[1], team:tm, cat:cat});
    });
    Promise.all(jobs).then(function(){ toast(rows.length+" students saved"); adminStudents(b); });
  };
  function draw(){
    var q = SQ.toLowerCase();
    var l = vals(S.students).filter(function(s){ return !q || (s.name+" "+s.ch).toLowerCase().indexOf(q)>=0; }).sort(function(a,b){return a.ch-b.ch});
    $("#slist").innerHTML = l.slice(0,200).map(function(s){ return '<div class="it"><b style="width:44px">'+esc(s.ch)+'</b><div class="sp"><b>'+esc(s.name)+'</b><div class="mu">'+esc((CT[s.cat]||{}).name||"")+'</div></div>'+teamTag(s.team)+'<button class="btn sm rd" data-sdel="'+esc(s.ch)+'">×</button></div>'; }).join("") || '<div class="empty">No students.</div>';
    $$("[data-sdel]").forEach(function(x){ x.onclick=function(){ var ch=x.getAttribute("data-sdel"); save("students/"+ch,null).then(function(){ toast("Removed"); draw(); }); }; });
  }
  $("#sq").oninput = function(){ SQ=this.value; draw(); };
  draw();
}

/* ----- admin: events ----- */
function adminEvents(b){
  var h = '<div class="card"><h3>Add event</h3><label>Category</label><select id="ecat">'+CATS.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select><label>Event name</label><input type="text" id="enm"><label>Stage</label><select id="estg"><option value="off">Off-stage</option><option value="on">On-stage</option></select><label>Type</label><select id="egrp"><option value="">Individual item</option><option value="1">Group item</option></select><label>Students per team (optional)</label><input type="number" id="esz"><div class="row mt"><button class="btn" id="eadd">Add event</button></div></div>';
  CATS.forEach(function(c){
    var l = eventsOf(c.id);
    h += '<div class="card mt"><h3>'+esc(c.name)+' ('+l.length+')</h3><div class="alist">'+(l.map(function(e){
      return '<div class="it"><div class="sp"><b>'+esc(e.name)+'</b>'+(e.group?' <span class="mu">· group</span>':'')+(declared(c.id,e.name)?' <span class="mu">· result out</span>':'')+'</div><select data-estg="'+esc(e.id)+'" style="width:auto">'+'<option value="off"'+(e.stage!=="on"?" selected":"")+'>Off-stage</option><option value="on"'+(e.stage==="on"?" selected":"")+'>On-stage</option></select><button class="btn sm rd" data-edel="'+esc(e.id)+'">×</button></div>';
    }).join("")||'<div class="empty">No events yet.</div>')+'</div></div>';
  });
  b.innerHTML = h;
  $("#eadd").onclick = function(){
    var nm=$("#enm").value.trim(), c=$("#ecat").value; if(!nm) return toast("Type the event name");
    var id=c+"-"+slug(nm); save("events/"+id, {id:id, cat:c, name:nm, stage:$("#estg").value, group:!!$("#egrp").value, size:+$("#esz").value||null}).then(function(ok){ if(ok){ toast("Event added"); adminEvents(b);} });
  };
  $$("[data-estg]",b).forEach(function(s){ s.onchange=function(){ var e=clone(S.events[s.getAttribute("data-estg")]); e.stage=s.value; save("events/"+e.id, e).then(function(){toast("Saved")}); }; });
  $$("[data-edel]",b).forEach(function(x){ x.onclick=function(){ save("events/"+x.getAttribute("data-edel"), null).then(function(){ toast("Event removed"); adminEvents(b); }); }; });
}

/* ----- admin: settings ----- */
function adminSettings(b){
  var p = S.settings.pts;
  b.innerHTML =
    '<div class="card"><h3>Points and dates</h3><div class="f2" style="grid-template-columns:1fr 1fr 1fr"><div><label>1st place</label><input type="number" id="p1" value="'+p[1]+'"></div><div><label>2nd place</label><input type="number" id="p2" value="'+p[2]+'"></div><div><label>3rd place</label><input type="number" id="p3" value="'+p[3]+'"></div></div>'+
    '<div class="mu" style="margin-top:6px">These fill in by default for new results. Old results keep their points.</div>'+
    '<div class="f2"><div><label>On-stage date</label><input type="date" id="sdt" value="'+esc(S.settings.onStage||"")+'"></div><div><label>Venue</label><input type="text" id="svn" value="'+esc(S.settings.venue||"")+'" placeholder="YES Swajian"></div></div>'+
    '<div class="f2"><div><label>Off-stage dates (poster)</label><input type="text" id="sof" value="'+esc(S.settings.offStage||"2026-11-06,2026-11-07")+'"></div><div><label>Place line (poster)</label><input type="text" id="spl" value="'+esc(S.settings.place||"SAWJIAN J&K")+'"></div></div>'+
    '<div class="row mt"><button class="btn" id="ssave">Save</button></div></div>'+

    '<div class="card mt"><h3>Live database (Firebase)</h3><div class="mu">With a live database, results you add on any phone appear for everyone who opens the website.</div>'+
    '<label>Database URL</label><input type="url" id="cdb" value="'+esc(conn.db)+'" placeholder="https://your-project-default-rtdb.firebaseio.com" autocapitalize="off">'+
    '<label>Room code</label><input type="text" id="croom" value="'+esc(conn.room)+'" autocapitalize="off">'+
    '<label>Admin key (database secret)</label><input type="password" id="ckey" value="'+esc(conn.key)+'" autocomplete="off">'+
    '<div class="mu" style="margin-top:6px">The key is kept only on this phone. It is never put into the website file.</div>'+
    '<div class="row mt"><button class="btn" id="ccon">Connect</button>'+(conn.db?'<button class="btn lt" id="cup">Upload all data</button><button class="btn rd" id="cdis">Disconnect</button>':'')+'</div><div id="cmsg" class="mt"></div></div>'+

    '<div class="card mt"><h3>Website file & backups</h3><div class="mu">The website file is one HTML file you upload to your free website host. It includes all results added so far and the database URL above (not the key).</div>'+
    '<div class="row mt"><button class="btn gd" id="xweb">Download website file</button><button class="btn lt" id="xcsv">Download results (CSV)</button><button class="btn lt" id="xjson">Backup (JSON)</button></div>'+
    '<label>Restore backup</label><input type="file" id="xin" accept=".json,application/json"></div>';

  $("#ssave").onclick = function(){
    var s = clone(S.settings); s.pts = {"1":+$("#p1").value||0,"2":+$("#p2").value||0,"3":+$("#p3").value||0}; s.onStage=$("#sdt").value; s.venue=$("#svn").value.trim(); s.offStage=$("#sof").value.trim(); s.place=$("#spl").value.trim();
    save("settings", s).then(function(ok){ if(ok) toast("Settings saved"); });
  };
  $("#ccon").onclick = function(){
    var db=$("#cdb").value.trim().replace(/\/+$/,""), room=$("#croom").value.trim()||"zealon-2026", key=$("#ckey").value.trim();
    if(!/^https:\/\/.+/.test(db)) return cmsg("Enter the database URL (it starts with https://).","err");
    var keep = clone(S);
    conn.db=db; conn.room=room; conn.key=key;
    fetch(url(""),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("read"); return r.json(); }).then(function(d){
      return fetch(checkUrl(),{method:"PUT",body:JSON.stringify(Date.now())}).then(function(w){
        if(!w.ok) throw new Error("key");
        ls("zl-db",db); ls("zl-room",room); ls("zl-key",key);
        if(!hasData(d)){ S = keep; remote.empty=true; cmsg("Connected. The database is empty – tap <b>Upload all data</b> to put the current results online.","ok"); }
        else { S = normalise(d); remote.empty=false; cmsg("Connected. Loaded "+vals(S.results).length+" results from the database.","ok"); }
        setLive("ok","Live"); setTimeout(function(){ adminSettings(b); }, 1200);
      });
    }).catch(function(e){
      conn.db=ls("zl-db")||CONFIG.db||""; conn.key=ls("zl-key")||""; S=keep;
      cmsg(e.message==="key" ? "Connected, but the admin key was refused. Check the database secret." : "Could not reach the database. Check the URL and the database rules (read must be allowed).","err");
    });
  };
  if($("#cup")) $("#cup").onclick = function(){
    uploadAll().then(function(){ cmsg("All data uploaded. Everyone now sees "+vals(S.results).length+" results.","ok"); }).catch(function(e){ cmsg(e.message||"Upload failed.","err"); });
  };
  if($("#cdis")) $("#cdis").onclick = function(){ ls("zl-db",null); ls("zl-key",null); ls("zl-room",null); conn.db=CONFIG.db; conn.key=""; toast("Disconnected on this phone"); location.reload(); };
  $("#xweb").onclick = function(){
    var cfg = JSON.stringify({db:conn.db, room:conn.room});
    var json = JSON.stringify(S).replace(/</g,"\\u003c");
    var out = PAGE.replace(/\/\*CONFIG\*\/[\s\S]*?\/\*\/CONFIG\*\//, "/*CONFIG*/"+cfg+"/*/CONFIG*/")
                  .replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/, function(m,a,c){ return a+json+c; });
    dl(new Blob([out],{type:"text/html"}), "index.html");
  };
  $("#xcsv").onclick = function(){
    var rows = [["Result No","Category","Event","Stage","Place","Chest No","Name","Team","Points"]];
    results().slice().reverse().forEach(function(r){ r.winners.slice().sort(function(a,b){return a.place-b.place}).forEach(function(w){ rows.push([pad(r.no),(CT[r.cat]||{}).name,r.event,r.stage==="on"?"On-stage":"Off-stage",PLACE[w.place],w.ch,w.name,w.team,w.pts]); }); });
    dl(new Blob(["﻿"+rows.map(function(r){return r.map(function(x){x=String(x==null?"":x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(",")}).join("\n")],{type:"text/csv"}), "zealon-results.csv");
  };
  $("#xjson").onclick = function(){ dl(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}), "zealon-backup.json"); };
  $("#xin").onchange = function(){
    var f=this.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ try{ var d=normalise(JSON.parse(rd.result)); S=d; if(conn.db) uploadAll().then(function(){toast("Backup restored")}).catch(function(e){toast(e.message)}); else { ls("zl-local",JSON.stringify(S)); toast("Backup restored"); } }catch(e){ toast("That file is not a ZEALON backup"); } };
    rd.readAsText(f);
  };
  function cmsg(t,c){ $("#cmsg").innerHTML='<div class="note '+(c||"")+'">'+t+'</div>'; }
}
function dl(blob, name){ var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1500); }

/* ---------- start ---------- */
$("#lgSchool").src = LOGO.school; $("#lgSchool2").src = LOGO.school; $("#lgZealon").src = LOGO.zealon;
window.addEventListener("hashchange", route);
route();
pull();
setInterval(function(){ if(conn.db && document.visibilityState!=="hidden") pull(); }, 15000);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") pull(); });
})();
